<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Akun Game</title>
    <!-- CSS Khusus -->
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Konfigurasi Tailwind untuk Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<!-- Tambahkan transisi dasar pada body agar perubahan tema terasa halus -->
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">

    <!-- TOP NAVBAR -->
    <header class="bg-blue-800 dark:bg-gray-950 text-white sticky top-0 z-50 transition-colors duration-300 shadow-md">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <!-- Logo -->
            <div class="text-2xl font-bold italic tracking-tighter cursor-pointer hover:scale-105 transition-transform">
                akun<span class="text-blue-300">hub</span>
            </div>

            <!-- Search Bar (Titik Audit Keamanan) -->
            <div class="flex-1 max-w-3xl relative">
                <form id="searchForm" class="w-full relative">
                    <input 
                        type="text" 
                        id="searchInput"
                        placeholder="Cari game, diamond, hero..." 
                        class="w-full py-2 px-4 rounded-md text-gray-900 dark:text-white dark:bg-gray-800 dark:border-gray-700 border focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all"
                        autocomplete="off"
                    >
                    <button type="submit" class="absolute right-2 top-1.5 text-gray-500 bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600 px-3 py-1 rounded text-sm transition-colors">
                        ENTER ↵
                    </button>
                </form>
            </div>

            <!-- Action Buttons: Theme Toggle & Auth -->
            <div class="flex items-center gap-3">
                <button id="themeToggle" class="p-2 rounded-full hover:bg-blue-700 dark:hover:bg-gray-800 transition-colors" title="Ubah Tema">
                    <span id="themeIcon" class="text-xl">🌙</span>
                </button>
                <button id="loginBtn" class="bg-transparent border border-white px-4 py-2 rounded-md hover:bg-white hover:text-blue-800 dark:hover:bg-gray-800 dark:hover:text-white transition-all font-semibold">
                    Masuk
                </button>
            </div>
        </div>

        <!-- Secondary Nav -->
        <nav class="container mx-auto px-4 py-2 text-sm flex gap-6 overflow-x-auto whitespace-nowrap border-t border-blue-700/50 dark:border-gray-800 hide-scrollbar">
            <a href="#" class="hover:text-blue-200 font-semibold">Kategori</a>
            <a href="#" class="hover:text-blue-200 transition-colors">Steam Voucher</a>
            <a href="#" class="hover:text-blue-200 transition-colors">Roblox Games</a>
            <a href="#" class="hover:text-blue-200 transition-colors">Mobile Legends</a>
            <a href="#" class="hover:text-blue-200 transition-colors">Free Fire</a>
        </nav>
    </header>

    <!-- HERO SECTION & BANNERS (Dengan Animasi) -->
    <section class="hero-bg text-white pt-6 pb-12 relative overflow-hidden animate-fade-in">
        <div class="container mx-auto px-4 relative z-10">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Promo Cards -->
                <div class="promo-card bg-yellow-600 rounded-lg h-64 flex flex-col items-center justify-center cursor-pointer shadow-lg hover:shadow-yellow-500/50">
                    <h3 class="text-xl font-bold text-yellow-100">Giveaway</h3>
                    <p class="text-sm mt-2">Join Now</p>
                </div>
                <div class="promo-card bg-blue-900 rounded-lg h-64 flex flex-col items-center justify-center cursor-pointer shadow-lg hover:shadow-blue-500/50">
                    <h3 class="text-xl font-bold">10th Anniversary</h3>
                    <p class="text-sm mt-2">Special Event</p>
                </div>
                <div class="promo-card bg-gray-900 rounded-lg h-64 flex flex-col items-center justify-center cursor-pointer shadow-lg hover:shadow-gray-500/50">
                    <h3 class="text-xl font-bold">Roblox Robux</h3>
                    <p class="text-sm mt-2">25% More</p>
                </div>
                <div class="promo-card bg-cyan-900 rounded-lg h-64 flex flex-col items-center justify-center cursor-pointer shadow-lg hover:shadow-cyan-500/50">
                    <h3 class="text-xl font-bold">Deep Sea</h3>
                    <p class="text-sm mt-2">Hot Games</p>
                </div>
            </div>
        </div>
    </section>

    <!-- TRUST BADGES -->
    <div class="bg-blue-700 dark:bg-gray-800 text-blue-100 py-3 text-sm flex flex-wrap justify-center gap-8 px-4 transition-colors duration-300">
        <span class="flex items-center gap-2 hover:text-white transition-colors cursor-default">✓ Transaksi Aman</span>
        <span class="flex items-center gap-2 hover:text-white transition-colors cursor-default">✓ Garansi Uang Kembali</span>
        <span class="flex items-center gap-2 hover:text-white transition-colors cursor-default">✓ Bantuan Customer Care 24/7</span>
    </div>

    <!-- MAIN CATEGORIES -->
    <main class="container mx-auto px-4 py-8 animate-fade-in" style="animation-delay: 0.2s;">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 flex flex-wrap justify-center gap-8 transition-colors duration-300">
            <!-- Category Icons -->
            <div class="category-icon text-center cursor-pointer group">
                <div class="w-14 h-14 bg-blue-50 dark:bg-gray-700 rounded-2xl flex items-center justify-center mx-auto mb-2 text-2xl group-hover:bg-blue-100 dark:group-hover:bg-gray-600 transition-colors">💎</div>
                <span class="text-sm text-gray-600 dark:text-gray-300 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">Top Up</span>
            </div>
            <div class="category-icon text-center cursor-pointer group">
                <div class="w-14 h-14 bg-blue-50 dark:bg-gray-700 rounded-2xl flex items-center justify-center mx-auto mb-2 text-2xl group-hover:bg-blue-100 dark:group-hover:bg-gray-600 transition-colors">🎮</div>
                <span class="text-sm text-gray-600 dark:text-gray-300 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">Game Key</span>
            </div>
            <div class="category-icon text-center cursor-pointer group">
                <div class="w-14 h-14 bg-blue-50 dark:bg-gray-700 rounded-2xl flex items-center justify-center mx-auto mb-2 text-2xl group-hover:bg-blue-100 dark:group-hover:bg-gray-600 transition-colors">👤</div>
                <span class="text-sm text-gray-600 dark:text-gray-300 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">Akun</span>
            </div>
            <div class="category-icon text-center cursor-pointer group">
                <div class="w-14 h-14 bg-blue-50 dark:bg-gray-700 rounded-2xl flex items-center justify-center mx-auto mb-2 text-2xl group-hover:bg-blue-100 dark:group-hover:bg-gray-600 transition-colors">🎟️</div>
                <span class="text-sm text-gray-600 dark:text-gray-300 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">Voucher</span>
            </div>
        </div>
        
        <!-- Output Hasil Pencarian -->
        <div id="searchResultArea" class="mt-8 p-4 bg-yellow-50 dark:bg-gray-800 border border-yellow-200 dark:border-gray-700 rounded-lg hidden transition-colors duration-300">
            <!-- Hasil disuntikkan ke sini -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
